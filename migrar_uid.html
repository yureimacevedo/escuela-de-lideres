<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Migrar UID - Escuela de Líderes</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f9f9f9}
h1{color:#2D6A4F;font-size:20px}
.campo{margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input{width:100%;padding:8px;border:1.5px solid #ccc;border-radius:6px;font-size:13px;box-sizing:border-box}
button{background:#2D6A4F;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;width:100%;margin-top:8px}
button:disabled{opacity:.5}
.log{background:#fff;border:1px solid #ccc;border-radius:8px;padding:12px;margin-top:16px;font-size:12px;font-family:monospace;max-height:400px;overflow-y:auto;white-space:pre-wrap}
.alerta{padding:10px;border-radius:6px;margin-bottom:12px;font-size:13px}
.alerta-info{background:#dbeafe;color:#1e40af}
.alerta-ok{background:#d1fae5;color:#065f46}
</style>
</head>
<body>
<h1>🔄 Migrar UID - Sandra</h1>
<div class="alerta alerta-info">Esta herramienta migra el historial de Sandra al nuevo UID.</div>

<div id="login-section">
  <div class="campo"><label>Correo admin</label><input id="email" type="email" value="yureimacevedo@gmail.com"></div>
  <div class="campo"><label>Contraseña</label><input id="password" type="password"></div>
  <button onclick="iniciarSesion()">Iniciar sesión</button>
</div>

<div id="migrar-section" style="display:none">
  <div class="alerta alerta-ok" id="sesion-ok"></div>
  
  <div class="campo">
    <label>UID viejo de Sandra</label>
    <input id="uid-viejo" value="5RJ3Zvl8CjTfvbBDBskGegfeBMr1">
  </div>
  <div class="campo">
    <label>UID nuevo de Sandra</label>
    <input id="uid-nuevo" value="06ChDrJ5bdaO6jRBtn5AdQTBc7E2">
  </div>
  
  <button onclick="migrarSandra()">Migrar Sandra ahora</button>
  <div class="log" id="log"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAnIdMMFURTfF9D6S7y-O4xbSXHVdGBeAI",
  authDomain:"escuela-de-lideres-ba682.firebaseapp.com",
  projectId:"escuela-de-lideres-ba682"
});
const auth = firebase.auth();
const db = firebase.firestore();

const COLS = ['el_respuestas','el_habitos_asignados','el_habitos_dia','el_compromisos_coach',
  'el_sesiones_asignadas','el_obs_habito_coach','el_comentarios_coach',
  'el_retroalimentacion','el_notas_coach','el_proxima_reunion','el_compromisos'];

function log(msg){ document.getElementById('log').textContent += msg + '\n'; }

async function iniciarSesion(){
  try{
    await auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value);
    document.getElementById('login-section').style.display='none';
    document.getElementById('migrar-section').style.display='block';
    document.getElementById('sesion-ok').textContent='✓ Sesión iniciada';
  }catch(e){ alert('Error: '+e.message); }
}

async function migrarSandra(){
  const viejo = document.getElementById('uid-viejo').value.trim();
  const nuevo = document.getElementById('uid-nuevo').value.trim();
  document.getElementById('log').textContent = '';
  log('Iniciando migración...');
  log('Viejo: ' + viejo);
  log('Nuevo: ' + nuevo);
  log('');
  
  let total = 0;
  
  for(const col of COLS){
    log('Revisando ' + col + '...');
    try{
      // Buscar por liderUid
      const snap = await db.collection(col).where('liderUid','==',viejo).get();
      log('  Encontrados por liderUid: ' + snap.size);
      
      if(snap.size > 0){
        const batch = db.batch();
        snap.docs.forEach(d => batch.update(d.ref, {liderUid: nuevo}));
        await batch.commit();
        log('  ✓ ' + snap.size + ' actualizados');
        total += snap.size;
      }
      
      // Buscar por liderDocId
      const snap2 = await db.collection(col).where('liderDocId','==',viejo).get();
      if(snap2.size > 0){
        log('  Encontrados por liderDocId: ' + snap2.size);
        const batch2 = db.batch();
        snap2.docs.forEach(d => batch2.update(d.ref, {liderDocId: nuevo}));
        await batch2.commit();
        log('  ✓ ' + snap2.size + ' actualizados por liderDocId');
        total += snap2.size;
      }
    }catch(e){
      log('  ERROR: ' + e.message);
    }
  }
  
  log('');
  log('Total migrados: ' + total);
  
  // Migrar documento el_usuarios
  try{
    const userDoc = await db.collection('el_usuarios').doc(viejo).get();
    if(userDoc.exists){
      log('Migrando documento el_usuarios...');
      const data = userDoc.data();
      data.uid = nuevo;
      await db.collection('el_usuarios').doc(nuevo).set(data);
      await db.collection('el_usuarios').doc(viejo).delete();
      log('✓ el_usuarios migrado');
    } else {
      log('No se encontró documento en el_usuarios con uid viejo');
    }
  }catch(e){ log('ERROR el_usuarios: ' + e.message); }
  
  log('');
  log('✅ COMPLETADO');
}
</script>
</body>
</html>
