function useRecordatorioHabitos(habitos, uid){
  _useEffect(function(){
    if(!habitos||!habitos.length) return;
    var interval=setInterval(function(){
      var ahora=new Date();
      var horaActual=String(ahora.getHours()).padStart(2,"0")+":"+String(ahora.getMinutes()).padStart(2,"0");
      var hoy=fechaHoy();
      habitos.forEach(function(h){
        if(h.activo===false) return;
        if(h.fechaInicio&&hoy<h.fechaInicio) return;
        if(h.fechaFin&&hoy>h.fechaFin) return;
        if(h.hora&&h.hora===horaActual){
          dispararNotificacion("Recordatorio de habito", h.descripcion);
        }
      });
    },60000);
    return function(){ clearInterval(interval); };
  },[JSON.stringify(habitos)]);
}
